# 担当講義
#
# 【毎年の更新】開講した年度を years: に足すだけです。他は触りません。
# 【科目の追加】科目ブロックを1つコピーし、シラバスを見ながら書き換えます。
#
#   code      シラバスの科目番号から、先頭2桁（年度）を除いた部分
#             例) 2026年度の 260K6140 → "0K6140"
#   dept      シラバスURLに現れる学部コード（2桁）
#   years     開講した年度。ここに追記していきます
#   title.en  省略すると日本語ページにのみ表示され、「日本語のみ」と表示されます
#   url       任意。書くとシラバスURLの自動生成より優先されます
#             （大学がURLの方式を変えたときは、ここに正しいURLを貼ってください）
#
# 科目名・開講期・対象学年が年度によって変わった場合は、エントリを2つに分けて
# years: を振り分けてください。同じ年度を両方に書くとビルドが止まります。

- code: "0K6140"
  dept: "03"
  years: [2024, 2025, 2026]
  semester: { ja: "通年", en: "All Year" }
  level:    { ja: "学部4年", en: "Undergraduate (4th year)" }
  title:
    ja: "卒業研究"
    en: "Graduation Thesis"

- code: "0K5801"
  dept: "03"
  years: [2024, 2025, 2026]
  semester: { ja: "後期", en: "Fall" }
  level:    { ja: "学部2〜6年", en: "Undergraduate (2nd-6th year)" }
  title:
    ja: "基礎物理学実験"
    en: "Basic Physics Experiment"

- code: "0K5805"
  dept: "03"
  years: [2024, 2025, 2026]
  semester: { ja: "前期", en: "Spring" }
  level:    { ja: "学部3〜6年", en: "Undergraduate (3rd-6th year)" }
  title:
    ja: "物理学セミナー"
    en: "Physics Seminar"

# 2026年度から大学院の合併により 260Y3106 でも履修登録できるが、同一の授業。
# シラバスは 0F3174 のものを掲載している。
- code: "0F3174"
  dept: "28"
  years: [2025, 2026]
  semester: { ja: "前期", en: "Spring" }
  level:    { ja: "大学院", en: "Graduate" }
  title:
    ja: "宇宙素粒子物理学概論（大学院）"
    en: "Astroparticle Physics (Graduate)"
