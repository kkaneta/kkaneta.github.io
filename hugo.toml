baseURL = "https://kkaneta.github.io/"
title = "Kaneta Kunio"
defaultContentLanguage = "ja"
defaultContentLanguageInSubdir = false

# Keep these above the first [table] header. A bare key written after one
# belongs to that table in TOML, so `disableKinds` placed below [build] became
# `build.disableKinds` and was dropped without a warning, which is how empty
# /categories/ and /tags/ pages ended up published and in the sitemap.
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

[module]
  [module.hugoVersion]
    # The templates use css.TailwindCSS and hugo.Data, both far newer than the
    # 0.116.0 this used to claim, so the check never protected anyone.
    extended = true
    min = "0.128.0"

[build]
  writeStats = true

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]

[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"], ["$", "$"]]
  [markup.highlight]
    style = "github"
    lineNos = false

[languages]
  [languages.ja]
    languageCode = "ja"
    languageName = "日本語"
    weight = 1
    [languages.ja.params]
      description = "金田邦雄のウェブサイト"

  [languages.en]
    languageCode = "en"
    languageName = "English"
    contentDir = "content/en"
    weight = 2
    [languages.en.params]
      description = "Kunio Kaneta's Website"

[services]
  [services.googleAnalytics]
    ID = "G-7WF9GREZC5"

# Name, position, institution, email and the profile links live in
# data/profile.yml — that is what the templates read. Only the two settings
# below are read from here.
[params]
  # Must match the author name INSPIRE returns, or the publications page stops
  # printing your own name in bold.
  author = "Kunio Kaneta"
  ogImage = "/images/og-default.png"
